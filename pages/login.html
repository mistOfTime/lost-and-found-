<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Wildcat Lost &amp; Found</title>
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com;
             style-src  'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com;
             font-src 'self' cdnjs.cloudflare.com cdn.jsdelivr.net ka-f.fontawesome.com;
             img-src    'self' data: *.supabase.co www.gstatic.com;
             connect-src 'self' *.supabase.co;
             frame-ancestors 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="auth-page">
  <!-- Left branding panel -->
  <div class="col-lg-5 d-none d-lg-flex auth-left">
    <div class="auth-left-content">
      <span class="auth-paw"><i class="fa-solid fa-paw"></i></span>
      <h2>WILDCAT<br/>LOST &amp; FOUND</h2>
      <p>CIT-U Campus System</p>

      <div class="mt-4" style="display:flex;flex-direction:column;gap:.7rem">
        <div style="display:flex;align-items:center;gap:.8rem;color:rgba(255,255,255,.8);font-size:.85rem">
          <i class="fa-solid fa-shield-halved" style="color:rgba(255,255,255,.6);width:20px"></i>
          Secure &amp; Private
        </div>
        <div style="display:flex;align-items:center;gap:.8rem;color:rgba(255,255,255,.8);font-size:.85rem">
          <i class="fa-solid fa-bell" style="color:rgba(255,255,255,.6);width:20px"></i>
          Real-time Notifications
        </div>
        <div style="display:flex;align-items:center;gap:.8rem;color:rgba(255,255,255,.8);font-size:.85rem">
          <i class="fa-solid fa-eye-slash" style="color:rgba(255,255,255,.6);width:20px"></i>
          Private Claim Evidence
        </div>
      </div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="col-12 col-lg-7 auth-right">
    <div class="auth-card">
      <!-- Mobile logo -->
      <div class="d-flex align-items-center gap-2 mb-4 d-lg-none">
        <div style="width:40px;height:40px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:1.1rem">
          <i class="fa-solid fa-paw"></i>
        </div>
        <div>
          <div style="font-size:.9rem;font-weight:800;color:var(--navy)">WILDCAT LOST &amp; FOUND</div>
          <div style="font-size:.7rem;color:var(--gray-500)">CIT-U Campus System</div>
        </div>
      </div>

      <h3>Welcome Back!</h3>
      <p class="auth-subtitle">Sign in to your account to continue.</p>

      <!-- Alert area -->
      <div id="login-alert" style="display:none"></div>

      <form id="login-form" novalidate>
        <div class="form-group-custom">
          <label class="form-label-custom" for="email">Email Address</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input id="email" type="email" class="form-control-custom" placeholder="yourname@cit.edu" autocomplete="email" />
          </div>
        </div>

        <div class="form-group-custom">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label-custom mb-0" for="password">Password</label>
            <a href="forgot-password.html" style="font-size:.82rem;color:var(--primary);font-weight:500">Forgot password?</a>
          </div>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input id="password" type="password" class="form-control-custom" placeholder="Enter your password" autocomplete="current-password" />
            <span class="input-icon-right" data-toggle-pw="password"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="d-flex align-items-center gap-2">
            <input type="checkbox" id="remember-me" style="accent-color:var(--primary);width:15px;height:15px;cursor:pointer" />
            <label for="remember-me" style="font-size:.85rem;color:var(--gray-600);cursor:pointer;margin:0">Remember me</label>
          </div>
        </div>

        <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2" id="login-btn">
          <span id="login-btn-text">Sign In</span>
          <span id="login-spinner" style="display:none"><span class="wlf-loader" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span></span>
        </button>

        <div class="divider-or">or</div>

        <!-- Google OAuth -->
        <button type="button" id="google-login-btn" class="w-100 py-2 d-flex align-items-center justify-content-center gap-2"
          style="border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;font-size:.93rem;font-weight:500;color:var(--gray-700);cursor:pointer;transition:var(--transition)">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google" />
          Continue with Google
        </button>

        <p class="text-center mt-4" style="font-size:.88rem;color:var(--gray-500)">
          Don't have an account? <a href="register.html" style="font-weight:600">Register here</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  // Handle OAuth callback — Supabase puts session in URL hash after Google redirect
  const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

  if (session) {
    // User is logged in — could be returning email user or fresh Google OAuth user
    await handleLoggedInUser(session.user);
    return;
  }

  // Listen for auth state changes (fires when Supabase processes the OAuth hash)
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      await handleLoggedInUser(session.user);
    }
  });
});

/**
 * Called after any successful sign-in (email or Google).
 * Ensures a profile row exists, checks status, then redirects.
 */
async function handleLoggedInUser(user) {
  let profile = await getUserProfile(user.id);

  if (!profile) {
    // New Google user — create profile row automatically
    const fullName = user.user_metadata?.full_name || user.user_metadata?.name || 'Google User';
    const email    = user.email || '';

    const { error: insertError } = await supabaseClient.from('profiles').insert({
      id:        user.id,
      full_name: fullName,
      school_id: '',           // Google users fill this in profile page later
      email,
      role:      'student',    // Default role for Google sign-ins
      status:    'active',
    });

    if (insertError && insertError.code !== '23505') {
      // 23505 = duplicate — profile already exists, just fetch it
      showAlert(document.getElementById('login-alert'), 'Failed to create account profile. Please try again.', 'error');
      document.getElementById('login-alert').style.display = 'flex';
      await supabaseClient.auth.signOut();
      return;
    }

    // Fetch the newly created profile
    profile = await getUserProfile(user.id);
    if (!profile) return;

    // Show a welcome message and prompt to complete profile
    showToast(`Welcome, ${fullName}! Please complete your profile.`, 'success');
    setTimeout(() => window.location.href = '../pages/profile.html', 1200);
    return;
  }

  // Existing user — check status
  if (profile.status === 'suspended') {
    await supabaseClient.auth.signOut();
    showAlert(document.getElementById('login-alert'), 'Your account has been suspended. Contact an administrator.', 'error');
    document.getElementById('login-alert').style.display = 'flex';
    return;
  }

  if (profile.status === 'pending') {
    await supabaseClient.auth.signOut();
    showAlert(document.getElementById('login-alert'), 'Your account is pending approval.', 'error');
    document.getElementById('login-alert').style.display = 'flex';
    return;
  }

  showToast(`Welcome back, ${profile.full_name.split(' ')[0]}!`, 'success');
  setTimeout(() => redirectToDashboard(profile.role), 800);
}

/* ---------- Login form ---------- */
/* ---------- Login rate limiting ---------- */
let loginAttempts = 0;
let loginLockUntil = 0;

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors('login-form');

  // Rate limit: exponential backoff
  const now = Date.now();
  if (now < loginLockUntil) {
    const secs = Math.ceil((loginLockUntil - now) / 1000);
    showAlert(document.getElementById('login-alert'), `Too many attempts. Please wait ${secs} seconds.`, 'error');
    document.getElementById('login-alert').style.display = 'flex';
    return;
  }

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const alertEl  = document.getElementById('login-alert');

  // Validation
  let valid = true;
  if (!email || !validateEmail(email)) {
    showFieldError('email', 'Enter a valid email address.'); valid = false;
  }
  if (!password || password.length < 1) {
    showFieldError('password', 'Password is required.'); valid = false;
  }
  if (!valid) return;

  // Loading state
  setLoading(true);
  alertEl.style.display = 'none';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    loginAttempts++;
    // Lock: 5s, 10s, 20s, 40s, 60s max
    const lockSeconds = Math.min(5 * Math.pow(2, loginAttempts - 1), 60);
    loginLockUntil = Date.now() + lockSeconds * 1000;
    setLoading(false);
    showAlert(alertEl, `${error.message} (${loginAttempts} failed attempt${loginAttempts > 1 ? 's' : ''})`, 'error');
    return;
  }

  loginAttempts = 0;
  await handleLoggedInUser(data.user);
});

/* ---------- Google OAuth ---------- */
document.getElementById('google-login-btn').addEventListener('click', async () => {
  const btn = document.getElementById('google-login-btn');
  btn.disabled = true;
  btn.innerHTML = `<span class="wlf-loader" style="border-color:rgba(0,0,0,.2);border-top-color:#800000;width:16px;height:16px;border-width:2px"></span> Connecting to Google…`;

  // Detect correct redirect URL — works on localhost and Vercel
  const redirectTo = window.location.origin + '/pages/login.html';

  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo,
      queryParams: {
        access_type: 'offline',
        prompt: 'consent',
      },
    },
  });

  if (error) {
    btn.disabled = false;
    btn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google" /> Continue with Google`;
    showAlert(document.getElementById('login-alert'), error.message, 'error');
    document.getElementById('login-alert').style.display = 'flex';
  }
  // If no error, browser redirects to Google — no further code runs here
});

function setLoading(loading) {
  document.getElementById('login-btn-text').style.display    = loading ? 'none' : 'inline';
  document.getElementById('login-spinner').style.display     = loading ? 'inline-flex' : 'none';
  document.getElementById('login-btn').disabled              = loading;
}

function showAlert(el, message, type) {
  el.className = `alert-custom ${type}`;
  const icon = type === 'error' ? 'fa-times-circle' : 'fa-check-circle';
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${sanitize(message)}</span>`;
  el.style.display = 'flex';
}
</script>
</body>
</html>
