<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Wildcat Lost &amp; Found</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="auth-page">
  <!-- Left branding panel -->
  <div class="col-lg-5 d-none d-lg-flex auth-left">
    <div class="auth-left-content">
      <span class="auth-paw"><i class="fa-solid fa-paw"></i></span>
      <h2>WILDCAT<br/>LOST &amp; FOUND</h2>
      <p>CIT-U Campus System</p>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="col-12 col-lg-7 auth-right">
    <div class="auth-card">

      <!-- Error state (expired link) -->
      <div id="error-state" style="display:none;text-align:center;padding:1rem 0">
        <div style="width:70px;height:70px;background:rgba(239,68,68,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:1.8rem;color:var(--danger)">
          <i class="fa-solid fa-link-slash"></i>
        </div>
        <h3 style="font-size:1.4rem;font-weight:800;color:var(--navy)">Link Expired</h3>
        <p style="color:var(--gray-500);font-size:.92rem;margin:1rem 0 1.5rem">
          This password reset link has expired or already been used.<br/>
          Please request a new one.
        </p>
        <a href="forgot-password.html" class="btn-primary-custom">
          <i class="fa-solid fa-rotate-left me-1"></i> Request New Link
        </a>
      </div>

      <!-- Success state -->
      <div id="success-state" style="display:none;text-align:center;padding:1rem 0">
        <div style="width:70px;height:70px;background:rgba(16,185,129,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:1.8rem;color:var(--success)">
          <i class="fa-solid fa-check-circle"></i>
        </div>
        <h3 style="font-size:1.4rem;font-weight:800;color:var(--navy)">Password Updated!</h3>
        <p style="color:var(--gray-500);font-size:.92rem;margin:1rem 0 1.5rem">
          Your password has been reset successfully.
        </p>
        <a href="login.html" class="btn-primary-custom">
          <i class="fa-solid fa-sign-in-alt me-1"></i> Sign In Now
        </a>
      </div>

      <!-- Form state -->
      <div id="form-state">
        <h3>Set New Password</h3>
        <p class="auth-subtitle">Enter and confirm your new password below.</p>

        <div id="rp-alert" style="display:none"></div>

        <form id="rp-form" novalidate>
          <div class="form-group-custom">
            <label class="form-label-custom" for="new-password">New Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input id="new-password" type="password" class="form-control-custom"
                placeholder="At least 8 characters" autocomplete="new-password" />
              <span class="input-icon-right" data-toggle-pw="new-password">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
            <!-- Password strength -->
            <div id="pw-strength-bar" style="margin-top:.4rem;height:4px;border-radius:99px;background:var(--gray-200);overflow:hidden">
              <div id="pw-strength-fill" style="height:100%;width:0%;border-radius:99px;transition:width .3s,background .3s"></div>
            </div>
            <div id="pw-strength-text" style="font-size:.74rem;color:var(--gray-400);margin-top:.2rem"></div>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom" for="confirm-password">Confirm New Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input id="confirm-password" type="password" class="form-control-custom"
                placeholder="Re-enter new password" autocomplete="new-password" />
              <span class="input-icon-right" data-toggle-pw="confirm-password">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2" id="rp-btn">
            <span id="rp-btn-text"><i class="fa-solid fa-key me-1"></i>Update Password</span>
            <span id="rp-spinner" style="display:none">
              <span class="wlf-loader" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>
            </span>
          </button>
        </form>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  // Check URL for error (expired link)
  const hash      = new URLSearchParams(window.location.hash.substring(1));
  const urlParams = new URLSearchParams(window.location.search);
  const errorCode = hash.get('error_code') || urlParams.get('error_code');

  if (errorCode === 'otp_expired' || hash.get('error') === 'access_denied') {
    document.getElementById('form-state').style.display   = 'none';
    document.getElementById('error-state').style.display  = 'block';
    return;
  }

  // Let Supabase process the recovery token from the URL hash
  const { data: { session }, error } = await supabaseClient.auth.getSession();

  if (!session) {
    // Listen for PASSWORD_RECOVERY event
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Form is already shown — user can proceed
      }
    });
  }

  // Password strength meter
  document.getElementById('new-password').addEventListener('input', function() {
    updateStrength(this.value);
  });
});

function updateStrength(pw) {
  let score = 0;
  if (pw.length >= 8)        score++;
  if (/[A-Z]/.test(pw))      score++;
  if (/[0-9]/.test(pw))      score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const fill   = document.getElementById('pw-strength-fill');
  const text   = document.getElementById('pw-strength-text');
  const levels = [
    { pct:'25%', color:'#ef4444', label:'Weak' },
    { pct:'50%', color:'#f59e0b', label:'Fair' },
    { pct:'75%', color:'#3b82f6', label:'Good' },
    { pct:'100%',color:'#10b981', label:'Strong' },
  ];
  const lvl = levels[Math.max(0, score - 1)];
  if (pw.length === 0) { fill.style.width = '0%'; text.textContent = ''; return; }
  fill.style.width      = lvl.pct;
  fill.style.background = lvl.color;
  text.textContent      = lvl.label;
  text.style.color      = lvl.color;
}

document.getElementById('rp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors('rp-form');

  const newPw     = document.getElementById('new-password').value;
  const confirmPw = document.getElementById('confirm-password').value;
  const alertEl   = document.getElementById('rp-alert');

  if (!validatePassword(newPw)) {
    showFieldError('new-password', 'Password must be at least 8 characters.');
    return;
  }
  if (newPw !== confirmPw) {
    showFieldError('confirm-password', 'Passwords do not match.');
    return;
  }

  // Loading
  document.getElementById('rp-btn-text').style.display  = 'none';
  document.getElementById('rp-spinner').style.display   = 'inline-flex';
  document.getElementById('rp-btn').disabled            = true;

  const { error } = await supabaseClient.auth.updateUser({ password: newPw });

  document.getElementById('rp-btn-text').style.display  = 'inline-flex';
  document.getElementById('rp-spinner').style.display   = 'none';
  document.getElementById('rp-btn').disabled            = false;

  if (error) {
    alertEl.className = 'alert-custom error';
    alertEl.innerHTML = `<i class="fa-solid fa-times-circle"></i><span>${sanitize(error.message)}</span>`;
    alertEl.style.display = 'flex';
    return;
  }

  // Sign out old session and show success
  await supabaseClient.auth.signOut();
  document.getElementById('form-state').style.display   = 'none';
  document.getElementById('success-state').style.display = 'block';
});
</script>
</body>
</html>
