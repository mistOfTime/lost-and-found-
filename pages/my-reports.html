<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports — LOST &amp; FOUND</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<nav class="navbar wlf-navbar navbar-expand-lg" style="position:sticky;top:0;z-index:1030">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <div class="brand-logo"><i class="fa-solid fa-paw"></i></div>
      <div class="brand-text">
        <span class="brand-title">LOST &amp; FOUND</span>
        <span class="brand-sub">CIT-U Campus System</span>
      </div>
    </a>
    <div class="ms-auto d-flex gap-2">
      <a id="dashboard-link" href="#" class="btn-nav-login">← Dashboard</a>
      <a href="report-item.html" class="btn-nav-register"><i class="fa-solid fa-plus me-1"></i>New Report</a>
    </div>
  </div>
</nav>

<div style="background:linear-gradient(135deg,var(--navy),var(--primary-dark));padding:2rem 0 1.2rem">
  <div class="container">
    <h1 style="color:#fff;font-weight:800;font-size:1.8rem;margin-bottom:.3rem">
      <i class="fa-solid fa-file-lines me-2" style="color:var(--accent)"></i>My Reports
    </h1>
    <p style="color:var(--gray-400);margin:0">All the items you've reported lost or found.</p>
  </div>
</div>

<div class="container py-4">
  <!-- Tabs -->
  <div class="d-flex gap-2 mb-4">
    <button id="tab-all"   class="btn-primary-custom" onclick="setTab('all')">All</button>
    <button id="tab-lost"  class="btn-outline-custom" onclick="setTab('lost')">Lost</button>
    <button id="tab-found" class="btn-outline-custom" onclick="setTab('found')">Found</button>
  </div>

  <div id="reports-container">
    <div class="text-center py-5" style="color:var(--gray-400)">
      <div class="loader-spin mx-auto mb-3" style="width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite"></div>
      Loading…
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal fade wlf-modal" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Delete Report</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><p style="font-size:.9rem;color:var(--gray-600)">Are you sure you want to delete this report? This action cannot be undone.</p></div>
      <div class="modal-footer">
        <button type="button" class="btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-danger-custom" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let currentTab = 'all';
let deleteItemId = null;
let deleteModal;

document.addEventListener('DOMContentLoaded', async () => {
  deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
  const auth = await requireAuth(['student', 'faculty', 'admin']);
  if (!auth) return;

  window._userId = auth.user.id;
  document.getElementById('dashboard-link').href =
    auth.profile.role === 'admin' ? '../dashboards/admin.html' :
    auth.profile.role === 'faculty' ? '../dashboards/faculty.html' :
    '../dashboards/student.html';

  await loadReports();

  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    if (!deleteItemId) return;
    const { error } = await supabaseClient.from('items').delete().eq('id', deleteItemId).eq('reporter_id', window._userId);
    deleteModal.hide();
    if (error) { showToast('Failed to delete report.', 'error'); return; }
    showToast('Report deleted.', 'success');
    loadReports();
  });
});

function setTab(tab) {
  currentTab = tab;
  ['all','lost','found'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    btn.className = t === tab ? 'btn-primary-custom' : 'btn-outline-custom';
  });
  loadReports();
}

async function loadReports() {
  const container = document.getElementById('reports-container');
  container.innerHTML = `<div class="text-center py-5" style="color:var(--gray-400)"><div class="loader-spin mx-auto mb-3" style="width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite"></div></div>`;

  let query = supabaseClient
    .from('items')
    .select('id, name, type, status, category, location, date_occurred, created_at, description')
    .eq('reporter_id', window._userId)
    .order('created_at', { ascending: false });

  if (currentTab !== 'all') query = query.eq('type', currentTab);

  const { data, error } = await query;

  if (error) { container.innerHTML = `<div class="text-center py-4" style="color:var(--danger)">Failed to load reports.</div>`; return; }

  if (!data || data.length === 0) {
    container.innerHTML = `
      <div class="text-center py-5">
        <i class="fa-solid fa-inbox" style="font-size:3rem;color:var(--gray-300)"></i>
        <p class="mt-3" style="color:var(--gray-500)">No reports yet.</p>
        <a href="report-item.html" class="btn-primary-custom mt-1"><i class="fa-solid fa-plus"></i>Report an Item</a>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="row g-3">${data.map(item => `
    <div class="col-md-6 col-lg-4">
      <div class="dash-card h-100">
        <div class="dash-card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge-${item.type}" style="font-size:.75rem">${capitalize(item.type)}</span>
            <span class="badge-${item.status}" style="font-size:.75rem">${capitalize(item.status)}</span>
          </div>
          <h6 style="font-weight:700;color:var(--navy);margin-bottom:.3rem">${sanitize(item.name)}</h6>
          <div style="font-size:.8rem;color:var(--gray-500);margin-bottom:.5rem">
            <i class="fa-solid fa-tag me-1"></i>${sanitize(item.category)} &nbsp;|&nbsp;
            <i class="fa-solid fa-location-dot me-1"></i>${sanitize(item.location)}
          </div>
          <p style="font-size:.82rem;color:var(--gray-600);margin-bottom:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${sanitize(item.description || '—')}</p>
          <div style="font-size:.76rem;color:var(--gray-400);margin-bottom:.8rem">${formatDate(item.date_occurred)}</div>
          <div class="d-flex gap-2">
            <a href="item-details.html?id=${item.id}" class="btn-outline-custom flex-fill justify-content-center py-1" style="font-size:.8rem">View</a>
            <button onclick="confirmDelete('${item.id}')" class="btn-danger-custom py-1 px-2" style="font-size:.8rem"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      </div>
    </div>`).join('')}</div>`;
}

function confirmDelete(id) {
  deleteItemId = id;
  deleteModal.show();
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
</script>
</body>
</html>
