<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Item — Wildcat Lost &amp; Found</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<nav class="navbar wlf-navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <div class="brand-logo"><i class="fa-solid fa-paw"></i></div>
      <div class="brand-text">
        <span class="brand-title">WILDCAT LOST &amp; FOUND</span>
        <span class="brand-sub">CIT-U Campus System</span>
      </div>
    </a>
  </div>
</nav>

<div style="background:linear-gradient(135deg,var(--navy),var(--primary-dark));padding:2rem 0 1.2rem">
  <div class="container">
    <h1 id="page-title" style="color:#fff;font-weight:800;font-size:1.8rem;margin-bottom:.3rem">Report Item</h1>
    <p style="color:var(--gray-400);margin:0">Provide as much detail as possible to help reunite items with their owners.</p>
  </div>
</div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <!-- Type Toggle -->
      <div class="dash-card mb-4">
        <div class="dash-card-body">
          <div class="d-flex gap-3">
            <label style="flex:1;cursor:pointer">
              <input type="radio" id="type-lost" name="item-type" value="lost" class="d-none" />
              <div id="type-lost-btn" class="text-center p-3 rounded" style="border:2px solid var(--danger);background:rgba(239,68,68,.06);transition:all .2s">
                <i class="fa-solid fa-magnifying-glass fa-lg" style="color:var(--danger)"></i>
                <div style="font-weight:700;color:var(--danger);margin-top:.4rem">Lost Item</div>
                <div style="font-size:.78rem;color:var(--gray-500)">I lost something</div>
              </div>
            </label>
            <label style="flex:1;cursor:pointer">
              <input type="radio" id="type-found" name="item-type" value="found" class="d-none" />
              <div id="type-found-btn" class="text-center p-3 rounded" style="border:2px solid var(--gray-200);transition:all .2s">
                <i class="fa-solid fa-box-open fa-lg" style="color:var(--gray-400)"></i>
                <div style="font-weight:700;color:var(--gray-600);margin-top:.4rem">Found Item</div>
                <div style="font-size:.78rem;color:var(--gray-500)">I found something</div>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="dash-card">
        <div class="dash-card-header">
          <h5 id="form-title"><i class="fa-solid fa-file-edit me-2"></i>Item Details</h5>
        </div>
        <div class="dash-card-body">
          <div id="form-alert" style="display:none"></div>

          <form id="report-form" novalidate>
            <div class="row g-3">
              <!-- Item name -->
              <div class="col-md-6">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-name">Item Name <span style="color:var(--danger)">*</span></label>
                  <input id="item-name" type="text" class="form-control-custom" placeholder="e.g. Black Backpack" />
                </div>
              </div>
              <!-- Category -->
              <div class="col-md-6">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-category">Category <span style="color:var(--danger)">*</span></label>
                  <select id="item-category" class="form-control-custom"></select>
                </div>
              </div>
              <!-- Date -->
              <div class="col-md-6">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-date" id="date-label">Date Lost <span style="color:var(--danger)">*</span></label>
                  <input id="item-date" type="date" class="form-control-custom" />
                </div>
              </div>
              <!-- Location -->
              <div class="col-md-6">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-location">Campus Location <span style="color:var(--danger)">*</span></label>
                  <select id="item-location" class="form-control-custom"></select>
                </div>
              </div>
              <!-- Brand -->
              <div class="col-md-6">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-brand">Brand <span style="color:var(--gray-400);font-weight:400">(optional)</span></label>
                  <input id="item-brand" type="text" class="form-control-custom" placeholder="e.g. Jansport, Apple" />
                </div>
              </div>
              <!-- Color -->
              <div class="col-md-6">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-color">Color <span style="color:var(--gray-400);font-weight:400">(optional)</span></label>
                  <input id="item-color" type="text" class="form-control-custom" placeholder="e.g. Black, Red" />
                </div>
              </div>
              <!-- Description -->
              <div class="col-12">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-desc">Description <span style="color:var(--danger)">*</span></label>
                  <textarea id="item-desc" class="form-control-custom" rows="4" placeholder="Describe the item in detail — size, markings, contents, any unique features…" style="resize:vertical"></textarea>
                </div>
              </div>
              <!-- Distinguishing features -->
              <div class="col-12">
                <div class="form-group-custom mb-0">
                  <label class="form-label-custom" for="item-features">Distinguishing Features <span style="color:var(--gray-400);font-weight:400">(optional)</span></label>
                  <input id="item-features" type="text" class="form-control-custom" placeholder="e.g. Sticker on the cover, broken zipper, name tag inside" />
                </div>
              </div>
              <!-- Image upload -->
              <div class="col-12">
                <label class="form-label-custom">Item Photo <span style="color:var(--gray-400);font-weight:400">(optional, max 5 MB)</span></label>
                <div id="upload-zone" class="upload-zone">
                  <i class="fa-solid fa-cloud-upload-alt"></i>
                  <p>Drag &amp; drop or <strong style="color:var(--primary)">browse</strong></p>
                  <span>PNG, JPG, WEBP up to 5 MB</span>
                </div>
                <input id="item-image" type="file" accept="image/*" style="display:none" />
                <img id="image-preview" src="" alt="" style="display:none;width:100%;max-height:220px;object-fit:contain;border-radius:var(--radius);margin-top:.8rem;border:1.5px solid var(--gray-200)" />
              </div>
            </div>

            <div class="d-flex gap-3 mt-4">
              <button type="submit" class="btn-primary-custom" id="submit-btn">
                <span id="submit-text"><i class="fa-solid fa-paper-plane me-1"></i>Submit Report</span>
                <span id="submit-spinner" style="display:none"><span class="wlf-loader" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span></span>
              </button>
              <a href="javascript:history.back()" class="btn-outline-custom">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>

<script>
let currentUser = null;
let currentType = 'lost';

document.addEventListener('DOMContentLoaded', async () => {
  const auth = await requireAuth(['student', 'faculty', 'admin']);
  if (!auth) return;
  currentUser = auth.user;

  populateSelect('item-category', ITEM_CATEGORIES, 'Select category…');
  populateSelect('item-location', CAMPUS_LOCATIONS, 'Select location…');

  // Set date max to today
  document.getElementById('item-date').max = new Date().toISOString().split('T')[0];

  // Read type from URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('type') === 'found') setType('found');
  else setType('lost');

  // Type toggle
  document.querySelectorAll('input[name="item-type"]').forEach(r => {
    r.addEventListener('change', () => setType(r.value));
  });

  // Image upload
  initUploadZone('upload-zone', 'item-image');
  previewImage('item-image', 'image-preview');
});

function setType(type) {
  currentType = type;
  document.getElementById('type-' + type).checked = true;

  const lostBtn  = document.getElementById('type-lost-btn');
  const foundBtn = document.getElementById('type-found-btn');

  lostBtn.style.borderColor  = type === 'lost' ? 'var(--danger)'  : 'var(--gray-200)';
  lostBtn.style.background   = type === 'lost' ? 'rgba(239,68,68,.06)'  : 'transparent';
  foundBtn.style.borderColor = type === 'found'? 'var(--success)' : 'var(--gray-200)';
  foundBtn.style.background  = type === 'found'? 'rgba(16,185,129,.06)' : 'transparent';

  lostBtn.querySelector('i').style.color   = type === 'lost'  ? 'var(--danger)'  : 'var(--gray-400)';
  lostBtn.querySelector('.fw-700, div:nth-child(2)').style &&
    (lostBtn.children[0].style.color = type === 'lost' ? 'var(--danger)' : 'var(--gray-400)');

  document.getElementById('date-label').innerHTML =
    `Date ${type === 'lost' ? 'Lost' : 'Found'} <span style="color:var(--danger)">*</span>`;
  document.getElementById('page-title').textContent =
    type === 'lost' ? 'Report a Lost Item' : 'Report a Found Item';
  document.getElementById('form-title').innerHTML =
    `<i class="fa-solid fa-file-edit me-2"></i>${type === 'lost' ? 'Lost' : 'Found'} Item Details`;
}

document.getElementById('report-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors('report-form');

  const name     = document.getElementById('item-name').value.trim();
  const category = document.getElementById('item-category').value;
  const date     = document.getElementById('item-date').value;
  const location = document.getElementById('item-location').value;
  const desc     = document.getElementById('item-desc').value.trim();
  const brand    = document.getElementById('item-brand').value.trim();
  const color    = document.getElementById('item-color').value.trim();
  const features = document.getElementById('item-features').value.trim();
  const imageFile= document.getElementById('item-image').files[0];
  const alertEl  = document.getElementById('form-alert');

  let valid = true;
  if (!name)     { showFieldError('item-name',     'Item name is required.');     valid = false; }
  if (!category) { showFieldError('item-category', 'Please select a category.'); valid = false; }
  if (!date)     { showFieldError('item-date',     'Date is required.');          valid = false; }
  if (!location) { showFieldError('item-location', 'Please select a location.'); valid = false; }
  if (!desc)     { showFieldError('item-desc',     'Description is required.');   valid = false; }
  if (!valid) return;

  setLoading(true);
  alertEl.style.display = 'none';

  try {
    // 1. Insert item
    const { data: item, error: itemErr } = await supabaseClient
      .from('items')
      .insert({
        reporter_id: currentUser.id,
        type:        currentType,
        name, category, location,
        date_occurred: date,
        description:   desc,
        brand:         brand || null,
        color:         color || null,
        distinguishing_features: features || null,
        status: 'pending',
      })
      .select()
      .single();

    if (itemErr) throw new Error(itemErr.message);

    // 2. Upload image if provided
    if (imageFile) {
      const ext  = imageFile.name.split('.').pop();
      const path = `${currentUser.id}/${item.id}.${ext}`;
      const { error: uploadErr } = await supabaseClient.storage
        .from('item-images')
        .upload(path, imageFile, { upsert: true });

      if (!uploadErr) {
        const { data: urlData } = supabaseClient.storage.from('item-images').getPublicUrl(path);
        await supabaseClient.from('item_images').insert({
          item_id:      item.id,
          storage_path: path,
          url:          urlData.publicUrl,
          is_primary:   true,
        });
      }
    }

    // 3. Log activity
    await supabaseClient.from('activity_logs').insert({
      user_id:    currentUser.id,
      action:     'report',
      description:`Reported ${currentType} item: ${name}`,
      entity_type:'item',
      entity_id:  item.id,
    });

    setLoading(false);
    alertEl.className = 'alert-custom success';
    alertEl.innerHTML = `<i class="fa-solid fa-check-circle"></i><span>Report submitted! Pending admin approval. <a href="item-details.html?id=${item.id}">View your report →</a></span>`;
    alertEl.style.display = 'flex';

    document.getElementById('report-form').reset();
    document.getElementById('image-preview').style.display = 'none';

  } catch (err) {
    setLoading(false);
    alertEl.className = 'alert-custom error';
    alertEl.innerHTML = `<i class="fa-solid fa-times-circle"></i><span>${sanitize(err.message)}</span>`;
    alertEl.style.display = 'flex';
  }
});

function setLoading(on) {
  document.getElementById('submit-text').style.display    = on ? 'none' : 'inline-flex';
  document.getElementById('submit-spinner').style.display = on ? 'inline-flex' : 'none';
  document.getElementById('submit-btn').disabled          = on;
}
</script>
</body>
</html>
