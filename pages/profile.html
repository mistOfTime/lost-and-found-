<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — LOST &amp; FOUND</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<nav class="navbar wlf-navbar navbar-expand-lg" style="position:sticky;top:0;z-index:1030">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <div class="brand-logo"><i class="fa-solid fa-paw"></i></div>
      <div class="brand-text">
        <span class="brand-title">LOST &amp; FOUND</span>
        <span class="brand-sub">CIT-U Campus System</span>
      </div>
    </a>
    <div class="ms-auto d-flex gap-2">
      <a id="dashboard-link" href="#" class="btn-nav-login">← Dashboard</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <!-- Profile card -->
      <div class="dash-card mb-4">
        <div class="dash-card-body d-flex flex-column flex-sm-row gap-4 align-items-center">
          <div id="avatar-display" style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;flex-shrink:0">?</div>
          <div>
            <h4 id="profile-name" style="font-weight:800;color:var(--navy);margin-bottom:.2rem">Loading…</h4>
            <div id="profile-role" style="font-size:.85rem;color:var(--gray-500);margin-bottom:.3rem"></div>
            <div id="profile-email" style="font-size:.88rem;color:var(--gray-600)"></div>
          </div>
        </div>
      </div>

      <!-- Edit form -->
      <div class="dash-card">
        <div class="dash-card-header"><h5><i class="fa-solid fa-user-pen me-2"></i>Edit Profile</h5></div>
        <div class="dash-card-body">
          <div id="profile-alert" style="display:none"></div>
          <form id="profile-form" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label-custom" for="p-fullname">Full Name</label>
                <input id="p-fullname" type="text" class="form-control-custom" />
              </div>
              <div class="col-md-6">
                <label class="form-label-custom" for="p-schoolid">School ID</label>
                <input id="p-schoolid" type="text" class="form-control-custom" />
              </div>
              <div class="col-md-6">
                <label class="form-label-custom" for="p-email">Email</label>
                <input id="p-email" type="email" class="form-control-custom" disabled style="background:var(--gray-50)" />
              </div>
              <div class="col-md-6">
                <label class="form-label-custom" for="p-phone">Phone <span style="font-weight:400;color:var(--gray-400)">(optional)</span></label>
                <input id="p-phone" type="tel" class="form-control-custom" placeholder="+63 9XX XXX XXXX" />
              </div>
              <div class="col-12">
                <label class="form-label-custom" for="p-dept">Department / Course</label>
                <input id="p-dept" type="text" class="form-control-custom" placeholder="e.g. BS Computer Science" />
              </div>
            </div>
            <div class="mt-4 d-flex gap-3">
              <button type="submit" class="btn-primary-custom" id="save-btn">
                <span id="save-text"><i class="fa-solid fa-floppy-disk me-1"></i>Save Changes</span>
                <span id="save-spinner" style="display:none"><span class="wlf-loader" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span></span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Change password -->
      <div class="dash-card mt-4">
        <div class="dash-card-header"><h5><i class="fa-solid fa-lock me-2"></i>Change Password</h5></div>
        <div class="dash-card-body">
          <div id="pw-alert" style="display:none"></div>
          <form id="pw-form" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label-custom" for="new-pw">New Password</label>
                <div class="input-icon-wrap">
                  <i class="fa-solid fa-lock input-icon"></i>
                  <input id="new-pw" type="password" class="form-control-custom" placeholder="At least 8 characters" />
                  <span class="input-icon-right" data-toggle-pw="new-pw"><i class="fa-solid fa-eye"></i></span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom" for="confirm-pw">Confirm New Password</label>
                <div class="input-icon-wrap">
                  <i class="fa-solid fa-lock input-icon"></i>
                  <input id="confirm-pw" type="password" class="form-control-custom" placeholder="Re-enter new password" />
                  <span class="input-icon-right" data-toggle-pw="confirm-pw"><i class="fa-solid fa-eye"></i></span>
                </div>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn-outline-custom" id="pw-btn">
                <span id="pw-btn-text"><i class="fa-solid fa-key me-1"></i>Update Password</span>
                <span id="pw-spinner" style="display:none"><span class="wlf-loader" style="border-color:rgba(128,0,0,.2);border-top-color:var(--primary)"></span></span>
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let _userId = null;

document.addEventListener('DOMContentLoaded', async () => {
  const auth = await requireAuth(['student', 'faculty', 'admin']);
  if (!auth) return;
  _userId = auth.user.id;
  const p = auth.profile;

  document.getElementById('dashboard-link').href =
    p.role === 'admin' ? '../dashboards/admin.html' :
    p.role === 'faculty' ? '../dashboards/faculty.html' :
    '../dashboards/student.html';

  document.getElementById('avatar-display').textContent  = getInitials(p.full_name);
  document.getElementById('profile-name').textContent    = p.full_name;
  document.getElementById('profile-role').textContent    = capitalize(p.role) + (p.department ? ' — ' + p.department : '');
  document.getElementById('profile-email').textContent   = p.email;

  document.getElementById('p-fullname').value = p.full_name || '';
  document.getElementById('p-schoolid').value = p.school_id || '';
  document.getElementById('p-email').value    = p.email || '';
  document.getElementById('p-phone').value    = p.phone || '';
  document.getElementById('p-dept').value     = p.department || '';
});

document.getElementById('profile-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alert = document.getElementById('profile-alert');
  const fullName = document.getElementById('p-fullname').value.trim();
  const schoolId = document.getElementById('p-schoolid').value.trim();
  const phone    = document.getElementById('p-phone').value.trim();
  const dept     = document.getElementById('p-dept').value.trim();

  if (!fullName) { showFieldError('p-fullname', 'Full name is required.'); return; }

  setSaveLoading(true);
  const { error } = await supabaseClient.from('profiles').update({
    full_name: fullName, school_id: schoolId,
    phone: phone || null, department: dept || null,
  }).eq('id', _userId);
  setSaveLoading(false);

  if (error) {
    alert.className = 'alert-custom error';
    alert.innerHTML = `<i class="fa-solid fa-times-circle"></i><span>${sanitize(error.message)}</span>`;
  } else {
    alert.className = 'alert-custom success';
    alert.innerHTML = `<i class="fa-solid fa-check-circle"></i><span>Profile updated successfully!</span>`;
    document.getElementById('profile-name').textContent = fullName;
    document.getElementById('avatar-display').textContent = getInitials(fullName);
  }
  alert.style.display = 'flex';
});

document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alert    = document.getElementById('pw-alert');
  const newPw    = document.getElementById('new-pw').value;
  const confirmPw= document.getElementById('confirm-pw').value;

  if (!validatePassword(newPw))  { showFieldError('new-pw', 'Password must be at least 8 characters.'); return; }
  if (newPw !== confirmPw)       { showFieldError('confirm-pw', 'Passwords do not match.'); return; }

  document.getElementById('pw-btn-text').style.display = 'none';
  document.getElementById('pw-spinner').style.display  = 'inline-flex';
  document.getElementById('pw-btn').disabled = true;

  const { error } = await supabaseClient.auth.updateUser({ password: newPw });

  document.getElementById('pw-btn-text').style.display = 'inline-flex';
  document.getElementById('pw-spinner').style.display  = 'none';
  document.getElementById('pw-btn').disabled = false;

  if (error) {
    alert.className = 'alert-custom error';
    alert.innerHTML = `<i class="fa-solid fa-times-circle"></i><span>${sanitize(error.message)}</span>`;
  } else {
    alert.className = 'alert-custom success';
    alert.innerHTML = `<i class="fa-solid fa-check-circle"></i><span>Password updated successfully!</span>`;
    document.getElementById('pw-form').reset();
  }
  alert.style.display = 'flex';
});

function setSaveLoading(on) {
  document.getElementById('save-text').style.display    = on ? 'none' : 'inline-flex';
  document.getElementById('save-spinner').style.display = on ? 'inline-flex' : 'none';
  document.getElementById('save-btn').disabled          = on;
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
</script>
</body>
</html>
