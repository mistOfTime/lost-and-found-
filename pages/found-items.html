<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Found Items — Wildcat Lost &amp; Found</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<nav class="navbar wlf-navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <div class="brand-logo"><i class="fa-solid fa-paw"></i></div>
      <div class="brand-text">
        <span class="brand-title">WILDCAT LOST &amp; FOUND</span>
        <span class="brand-sub">CIT-U Campus System</span>
      </div>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <i class="fa-solid fa-bars text-white"></i>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto ms-3 gap-1">
        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="lost-items.html">Lost Items</a></li>
        <li class="nav-item"><a class="nav-link active" href="found-items.html">Found Items</a></li>
      </ul>
      <div id="nav-auth-area" class="d-flex gap-2 mt-2 mt-lg-0">
        <a class="btn-nav-login" href="login.html">Login</a>
        <a class="btn-nav-register" href="register.html">Register</a>
      </div>
    </div>
  </div>
</nav>

<div style="background:linear-gradient(135deg,var(--navy),var(--primary-dark));padding:2.5rem 0 1.5rem">
  <div class="container">
    <h1 style="color:#fff;font-weight:800;font-size:1.8rem;margin-bottom:.3rem">
      <i class="fa-solid fa-box-open me-2" style="color:#34d399"></i>Found Items
    </h1>
    <p style="color:var(--gray-400);margin:0">Browse all items found and turned in on campus. Claim yours!</p>
  </div>
</div>

<div style="background:#fff;border-bottom:1.5px solid var(--gray-200);padding:1rem 0;position:sticky;top:60px;z-index:100">
  <div class="container">
    <div class="row g-2 align-items-center">
      <div class="col-md-4">
        <div class="input-icon-wrap">
          <i class="fa-solid fa-magnifying-glass input-icon"></i>
          <input id="search-input" type="text" class="form-control-custom" placeholder="Search found items…" />
        </div>
      </div>
      <div class="col-md-2">
        <select id="filter-category" class="form-control-custom"></select>
      </div>
      <div class="col-md-2">
        <select id="filter-location" class="form-control-custom"></select>
      </div>
      <div class="col-md-2">
        <input id="filter-date" type="date" class="form-control-custom" />
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn-primary-custom flex-fill justify-content-center" onclick="applyFilters()">
          <i class="fa-solid fa-filter"></i> Filter
        </button>
        <button class="btn-outline-custom px-2" onclick="clearFilters()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <p id="results-count" style="font-size:.88rem;color:var(--gray-500);margin:0">Loading…</p>
    <a href="report-item.html?type=found" class="btn-primary-custom">
      <i class="fa-solid fa-plus"></i> Report Found Item
    </a>
  </div>

  <div class="row g-3" id="items-grid"></div>
  <div class="d-flex justify-content-center mt-4 gap-2" id="pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>

<script>
const PAGE_SIZE = 12;
let currentPage = 0, totalCount = 0;

const catIcons = {
  'Electronics':'fa-mobile-alt','Clothing & Accessories':'fa-shirt',
  'Books & Notes':'fa-book','ID & Cards':'fa-id-card',
  'Bags & Backpacks':'fa-shopping-bag','Keys':'fa-key',
  'Jewelry & Watches':'fa-gem','Sports Equipment':'fa-baseball',
  'School Supplies':'fa-pencil','Other':'fa-box',
};

document.addEventListener('DOMContentLoaded', async () => {
  populateSelect('filter-category', ITEM_CATEGORIES, 'All Categories');
  populateSelect('filter-location', CAMPUS_LOCATIONS, 'All Locations');

  const params = new URLSearchParams(window.location.search);
  if (params.get('q'))        document.getElementById('search-input').value = params.get('q');
  if (params.get('category')) document.getElementById('filter-category').value = params.get('category');

  await loadItems();

  const user = await getCurrentUser();
  if (user) {
    const profile = await getUserProfile(user.id);
    if (profile) {
      document.getElementById('nav-auth-area').innerHTML = `
        <a class="btn-nav-register" href="${profile.role === 'admin' ? '../dashboards/admin.html' : (profile.role === 'faculty' ? '../dashboards/faculty.html' : '../dashboards/student.html')}">
          <i class="fa-solid fa-gauge me-1"></i>Dashboard
        </a>`;
    }
  }

  let debounce;
  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { currentPage = 0; loadItems(); }, 350);
  });
});

async function loadItems() {
  const grid  = document.getElementById('items-grid');
  const count = document.getElementById('results-count');
  grid.innerHTML = `<div class="col-12 text-center py-5"><div class="loader-spin mx-auto" style="width:40px;height:40px;border:4px solid var(--gray-200);border-top-color:var(--success);border-radius:50%;animation:spin .8s linear infinite"></div></div>`;

  const q        = document.getElementById('search-input').value.trim();
  const category = document.getElementById('filter-category').value;
  const location = document.getElementById('filter-location').value;
  const date     = document.getElementById('filter-date').value;

  let query = supabaseClient
    .from('items')
    .select('id, name, category, location, date_occurred, description, status, created_at', { count: 'exact' })
    .eq('type', 'found')
    .neq('status', 'rejected')
    .neq('status', 'pending')
    .order('created_at', { ascending: false })
    .range(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE - 1);

  if (q)        query = query.ilike('name', `%${q}%`);
  if (category) query = query.eq('category', category);
  if (location) query = query.eq('location', location);
  if (date)     query = query.eq('date_occurred', date);

  const { data, error, count: total } = await query;
  totalCount = total || 0;

  if (error) {
    grid.innerHTML = `<div class="col-12 text-center py-5" style="color:var(--danger)">Failed to load items.</div>`;
    return;
  }

  count.textContent = `${totalCount} found item${totalCount !== 1 ? 's' : ''} available`;

  if (!data || data.length === 0) {
    grid.innerHTML = `
      <div class="col-12 text-center py-5">
        <i class="fa-solid fa-box-open" style="font-size:3rem;color:var(--gray-300)"></i>
        <p class="mt-3" style="color:var(--gray-500)">No found items match your search.</p>
        <a href="report-item.html?type=found" class="btn-primary-custom mt-1"><i class="fa-solid fa-plus"></i>Report a Found Item</a>
      </div>`;
    renderPagination();
    return;
  }

  grid.innerHTML = data.map(item => `
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="item-card" onclick="window.location.href='item-details.html?id=${item.id}'" style="cursor:pointer">
        <div class="item-card-img-placeholder">
          <i class="fa-solid ${catIcons[item.category] || 'fa-box'}"></i>
        </div>
        <div class="item-card-body">
          <div class="d-flex justify-content-between align-items-start mb-1">
            <span class="item-card-title">${sanitize(item.name)}</span>
            <span class="badge-found">Found</span>
          </div>
          <div class="item-card-meta">
            <span><i class="fa-solid fa-tag"></i>${sanitize(item.category)}</span>
            <span><i class="fa-solid fa-location-dot"></i>${sanitize(item.location || '—')}</span>
          </div>
          <p class="item-card-desc">${sanitize(item.description || 'No description.')}</p>
          <div class="d-flex justify-content-between align-items-center mt-auto">
            <span style="font-size:.76rem;color:var(--gray-400)"><i class="fa-regular fa-calendar me-1"></i>${formatDate(item.date_occurred)}</span>
            <span style="font-size:.8rem;color:var(--primary);font-weight:600">View →</span>
          </div>
        </div>
      </div>
    </div>`).join('');

  renderPagination();
}

function renderPagination() {
  const container = document.getElementById('pagination');
  const pages = Math.ceil(totalCount / PAGE_SIZE);
  if (pages <= 1) { container.innerHTML = ''; return; }
  let html = '';
  for (let i = 0; i < pages; i++) {
    html += `<button onclick="goPage(${i})" class="${i === currentPage ? 'btn-primary-custom' : 'btn-outline-custom'}" style="min-width:38px;justify-content:center">${i + 1}</button>`;
  }
  container.innerHTML = html;
}

function goPage(p) { currentPage = p; loadItems(); window.scrollTo({ top: 200, behavior: 'smooth' }); }
function applyFilters() { currentPage = 0; loadItems(); }
function clearFilters() {
  ['search-input','filter-category','filter-location','filter-date'].forEach(id => {
    document.getElementById(id).value = '';
  });
  currentPage = 0; loadItems();
}
</script>
</body>
</html>
