<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — LOST &amp; FOUND</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<nav class="navbar wlf-navbar navbar-expand-lg" style="position:sticky;top:0;z-index:1030">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <div class="brand-logo"><i class="fa-solid fa-paw"></i></div>
      <div class="brand-text">
        <span class="brand-title">LOST &amp; FOUND</span>
        <span class="brand-sub">CIT-U Campus System</span>
      </div>
    </a>
    <div class="ms-auto d-flex gap-2">
      <a id="dashboard-link" href="#" class="btn-nav-register">Dashboard</a>
    </div>
  </div>
</nav>

<div style="background:linear-gradient(135deg,var(--navy),var(--primary-dark));padding:2rem 0 1.2rem">
  <div class="container">
    <h1 style="color:#fff;font-weight:800;font-size:1.8rem;margin-bottom:.3rem">
      <i class="fa-solid fa-bell me-2" style="color:var(--accent)"></i>Notifications
    </h1>
    <p style="color:var(--gray-400);margin:0">Stay updated on your items, claims, and messages.</p>
  </div>
</div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="dash-card">
        <div class="dash-card-header">
          <h5><span id="unread-count-label">Notifications</span></h5>
          <button class="btn-outline-custom py-1 px-3" style="font-size:.8rem" onclick="markAllRead()">
            <i class="fa-solid fa-check-double me-1"></i>Mark All Read
          </button>
        </div>
        <div id="notifications-list">
          <div class="text-center py-5" style="color:var(--gray-400)">
            <div class="loader-spin mx-auto mb-3" style="width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite"></div>
            Loading…
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>

<script>
let currentUserId = null;

document.addEventListener('DOMContentLoaded', async () => {
  const auth = await requireAuth(['student', 'faculty', 'admin']);
  if (!auth) return;
  currentUserId = auth.user.id;

  const { profile } = auth;
  document.getElementById('dashboard-link').href =
    profile.role === 'admin'   ? '../dashboards/admin.html'   :
    profile.role === 'faculty' ? '../dashboards/faculty.html' :
    '../dashboards/student.html';

  await loadNotifications();

  // Live updates
  supabaseClient.channel('notifs-page')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${currentUserId}` },
      () => loadNotifications())
    .subscribe();
});

async function loadNotifications() {
  const list = document.getElementById('notifications-list');

  const { data, error } = await supabaseClient
    .from('notifications')
    .select('*')
    .eq('user_id', currentUserId)
    .order('created_at', { ascending: false });

  if (error || !data) {
    list.innerHTML = `<div class="text-center py-4" style="color:var(--danger)">Failed to load notifications.</div>`;
    return;
  }

  const unread = data.filter(n => !n.is_read).length;
  document.getElementById('unread-count-label').textContent =
    unread > 0 ? `Notifications (${unread} unread)` : 'Notifications';

  if (data.length === 0) {
    list.innerHTML = `
      <div class="text-center py-5">
        <i class="fa-solid fa-bell-slash" style="font-size:3rem;color:var(--gray-300)"></i>
        <p class="mt-3" style="color:var(--gray-500)">No notifications yet.</p>
      </div>`;
    return;
  }

  const typeConfig = {
    'claim_submitted':{ icon:'fa-shield-halved', color:'var(--primary)' },
    'claim_approved':  { icon:'fa-check-circle', color:'var(--success)' },
    'claim_rejected':  { icon:'fa-times-circle', color:'var(--danger)'  },
    'item_approved':   { icon:'fa-check-circle', color:'var(--success)' },
    'item_rejected':   { icon:'fa-times-circle', color:'var(--danger)'  },
    'default':         { icon:'fa-bell',          color:'var(--primary)' },
  };

  list.innerHTML = data.map(n => {
    const cfg = typeConfig[n.type] || typeConfig['default'];
    return `
      <div class="notification-item ${n.is_read ? '' : 'unread'}" onclick="markRead('${n.id}', '${n.link && n.link.startsWith('/') ? n.link.replace(/'/g, '') : ''}')" style="cursor:pointer">
        <div class="notif-icon" style="background:${cfg.color}18;color:${cfg.color}">
          <i class="fa-solid ${cfg.icon}"></i>
        </div>
        <div class="notif-content" style="flex:1">
          <div class="notif-title">${sanitize(n.message)}</div>
          <div class="notif-time">${formatDateTime(n.created_at)}</div>
        </div>
        ${!n.is_read ? '<div style="width:8px;height:8px;background:var(--primary);border-radius:50%;flex-shrink:0;margin-top:.4rem"></div>' : ''}
      </div>`;
  }).join('');
}

async function markRead(id, link) {
  await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
  updateNotifBadge();
  // Only follow links that are relative paths — block external redirects
  if (link && link.startsWith('/')) {
    window.location.href = link;
  } else {
    loadNotifications();
  }
}

async function markAllRead() {
  await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUserId).eq('is_read', false);
  showToast('All notifications marked as read.', 'success');
  updateNotifBadge();
  loadNotifications();
}
</script>
</body>
</html>
